<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JReverse</title>
    <script>
      // The saved theme and motion, before the first paint (src/lib/theme.svelte.ts, motion.svelte.ts).
      try {
        var t = localStorage.getItem("jreverse.theme");
        if (t === "graphite" || t === "indigo" || t === "paper") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("jreverse.motion") === "off") document.documentElement.dataset.motion = "off";
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
